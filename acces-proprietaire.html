<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#061b14">
<title>Accès propriétaire DRIVER — DIGIYLYFE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:linear-gradient(180deg,#07140f,#0d3f30 35%,#eef4ef 35%);font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:#16342c}.wrap{width:min(620px,calc(100% - 22px));margin:auto;padding:18px 0 42px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#fff}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:999px;padding:8px 11px;font-weight:900;font-size:11px}.hero{color:#fff;padding:28px 2px 24px}.hero h1{font-size:clamp(36px,9vw,58px);line-height:.95;margin:8px 0}.hero p{color:#d9eee1;font-weight:760;line-height:1.5}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 48px #061b1430}.field{display:grid;gap:6px;margin-top:12px}.field label{font-size:10px;font-weight:1000;text-transform:uppercase;color:#6f7f79}input{width:100%;min-height:50px;border:1px solid #cbd9d1;border-radius:13px;padding:11px 12px;font:inherit}.btn{width:100%;margin-top:12px;border:0;border-radius:999px;min-height:50px;padding:11px 16px;background:#155f43;color:#fff;font:inherit;font-weight:1000;cursor:pointer}.gold{background:#facc15;color:#173f35}.status{min-height:21px;margin-top:11px;font-size:12px;font-weight:900;white-space:pre-line}.bad{color:#a3231d}.hidden{display:none!important}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:#e7f4eb;color:#155f43;font-size:11px;font-weight:1000}
</style></head>
<body><div class="wrap">
<header class="top"><strong>🚗 DIGIY DRIVER</strong><a href="./index.html">← DRIVER</a></header>
<section class="hero"><span class="pill">ESPACE PROPRIÉTAIRE</span><h1>Accéder à mon chauffeur.</h1><p>Connexion sécurisée par email. Après validation, vous ouvrez directement votre gestion DRIVER MASTER.</p></section>
<section class="card">
<div class="field"><label>Email propriétaire</label><input id="email" type="email" autocomplete="email"></div>
<button class="btn" id="send">RECEVOIR MON ACCÈS →</button>
<div id="otpBox" class="hidden"><div class="field"><label>Code reçu</label><input id="otp" inputmode="numeric" autocomplete="one-time-code"></div><button class="btn gold" id="verify">OUVRIR MA GESTION →</button></div>
<div class="status" id="status"></div>
</section></div>
<script>
(()=>{'use strict';
const URL='https://wesqmwjjtsefyjnluosj.supabase.co',KEY='sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3';
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),p=new URLSearchParams(location.search);
const slug=(p.get('slug')||'baptiste-driver-ambassador').trim();
const target='./gestion.html?slug='+encodeURIComponent(slug);
const redirect=()=>location.origin+location.pathname+'?slug='+encodeURIComponent(slug);
function msg(t,b=false){$('status').textContent=t||'';$('status').classList.toggle('bad',!!b)}
async function openIfSession(){const {data}=await db.auth.getSession();if(data?.session)location.replace(target)}
$('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return msg('Indiquez votre email propriétaire.',true);$('send').disabled=true;const {error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:redirect()}});$('send').disabled=false;if(error)return msg('⚠️ '+error.message,true);$('otpBox').classList.remove('hidden');msg('Email envoyé. Cliquez sur le lien reçu ou entrez le code.')};
$('verify').onclick=async()=>{const email=$('email').value.trim(),token=$('otp').value.trim();const {data,error}=await db.auth.verifyOtp({email,token,type:'email'});if(error)return msg('⚠️ Code invalide ou expiré.',true);if(data?.session)location.replace(target)};
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)setTimeout(()=>location.replace(target),0)});
openIfSession();
})();
</script></body></html>
